<!-- 정보 수정 모달 -->
<div class="modal fade bs-modal" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-light">
        <h5 class="modal-title" id="editProfileLabel">✏️ 정보 수정</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
        <div class="security-notice">
          <h4>🔒 보안 안내</h4>
          <p>사업자등록번호는 보안상의 이유로 수정할 수 없습니다. 변경이 필요한 경우 고객센터로 문의해주세요.</p>
        </div>
        <form id="profileForm" method="POST" action="/profile/update">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
          <div class="form-group">
            <label for="username">사용자명</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" disabled>
            <div class="field-info">시스템 식별자로 변경할 수 없습니다</div>
          </div>
          <div class="form-group">
            <label for="business_number">사업자등록번호</label>
            <input type="text" id="business_number" name="business_number" value="{{ user.business_number }}" disabled>
            <div class="field-info">보안상의 이유로 수정할 수 없습니다</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="company_name">회사명 *</label>
              <input type="text" id="company_name" name="company_name" value="{{ user.company_name }}" required>
              <div class="validation-message" id="company_name_msg"></div>
            </div>
            <div class="form-group">
              <label for="representative_name">대표자명 *</label>
              <input type="text" id="representative_name" name="representative_name" value="{{ user.representative_name }}" required>
              <div class="validation-message" id="representative_name_msg"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">전화번호 *</label>
              <input type="tel" id="phone" name="phone" value="{{ user.phone }}" placeholder="예: 010-9702-3996 또는 01097023996" required>
              <div class="validation-message" id="phone_msg"></div>
            </div>
            <div class="form-group">
              <label for="email">이메일 *</label>
              <input type="email" id="email" name="email" value="{{ user.email }}" required>
              <div class="validation-message" id="email_msg"></div>
            </div>
          </div>
          <div class="form-group">
            <label for="address">사업장 주소</label>
            <input type="text" id="address" name="address" value="{{ user.address }}">
            <div class="validation-message" id="address_msg"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="business_type">업태 *</label>
              <input type="text" id="business_type" name="business_type" value="{{ user.business_type or '' }}" placeholder="예: 도소매업, 제조업, 서비스업" required>
              <div class="validation-message" id="business_type_msg"></div>
            </div>
            <div class="form-group">
              <label for="business_category">종목 *</label>
              <input type="text" id="business_category" name="business_category" value="{{ user.business_category or '' }}" placeholder="예: 컴퓨터 및 주변장치 도소매업" required>
              <div class="validation-message" id="business_category_msg"></div>
            </div>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-save-direct" class="btn btn-primary w-100">💾 저장하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
