<!-- 활동 내역 리스트 뷰 (테이블 형태) -->
<!-- 필터 바는 profile_modern.html 로 이동됨 -->

<div class="activity-list-wrapper">
    <table class="activity-table table table-hover align-middle table-borderless">
        <colgroup>
            <col style="width: 15%">
            <col style="width: 10%">
            <col style="width: 55%">
            <col style="width: 10%">
            <col style="width: 10%">
        </colgroup>
        <thead class="table-light">
            <tr>
                <th class="header-date text-center">날짜</th>
                <th class="header-type text-center">활동 유형</th>
                <th class="header-details text-start">상세 내용</th>
                <th class="header-change text-center">변동</th>
                <th class="header-action text-center">관리</th>
            </tr>
        </thead>
        <tbody class="activity-table-body-target">
            <tr class="activity-loading-row">
                <td colspan="5" class="text-center py-4">
                    <div class="activity-loading">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        <span class="ms-2 text-muted">데이터를 불러오는 중입니다...</span>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <nav class="activity-pagination d-flex justify-content-center mt-3" aria-label="Activity pagination">
        <div class="btn-group">
            <button type="button" id="activity-page-prev" class="btn btn-outline-secondary btn-sm" disabled>이전</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" disabled id="activity-page-info">1 / 1</button>
            <button type="button" id="activity-page-next" class="btn btn-outline-secondary btn-sm" disabled>다음</button>
        </div>
    </nav>
</div>
