<!-- 세무 리포트 탭 - 부가세 신고 전용 통계 시스템 -->
<section class="panel hidden" id="tax-report">
    <div class="hd">
        <div class="d-flex align-items-center justify-content-between">
            <span>💰 세무 리포트</span>
            <button class="btn btn-primary btn-sm" id="btnDownloadTaxReport" onclick="downloadTaxReport()">
                📥 세무사 제출용 엑셀 다운로드
            </button>
        </div>
    </div>
    <div class="bd">
        <!-- 컨트롤 패널 -->
        <div class="card mb-3">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-6">
                        <label class="form-label small text-muted mb-2">보고서 유형</label>
                        <div class="btn-group w-100" role="group" id="taxReportTypeGroup">
                            <button type="button" class="btn btn-outline-primary btn-sm" data-type="daily">일별</button>
                            <button type="button" class="btn btn-outline-primary btn-sm active" data-type="monthly">월별</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" data-type="quarterly">분기별</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" data-type="yearly">년별</button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="taxReportYear" class="form-label small text-muted mb-2">연도</label>
                        <input type="number" class="form-control form-control-sm" id="taxReportYear" 
                               min="2020" max="2099">
                    </div>
                    <div class="col-md-3">
                        <label for="taxReportMonth" class="form-label small text-muted mb-2">월</label>
                        <input type="number" class="form-control form-control-sm" id="taxReportMonth" 
                               min="1" max="12">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <label for="taxReportStartDate" class="form-label small text-muted mb-2">시작일</label>
                        <input type="date" class="form-control form-control-sm" id="taxReportStartDate">
                    </div>
                    <div class="col-md-6">
                        <label for="taxReportEndDate" class="form-label small text-muted mb-2">종료일</label>
                        <input type="date" class="form-control form-control-sm" id="taxReportEndDate">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12 text-end">
                        <button type="button" class="btn btn-primary" id="btnLoadTaxStats" onclick="loadTaxStats()">
                            🔍 조회
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 요약 카드 (4개) -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; border: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div style="font-size: 2.5rem; margin-right: 1rem;">💰</div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1" style="opacity: 0.9;">총 거래액</h6>
                                <h4 class="mb-0 fw-bold" id="taxTotalRevenue">0원</h4>
                                <small style="opacity: 0.8;">paid + cancelled</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card" style="background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: white; border: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div style="font-size: 2.5rem; margin-right: 1rem;">❌</div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1" style="opacity: 0.9;">취소/환불</h6>
                                <h4 class="mb-0 fw-bold" id="taxRefunds">0원</h4>
                                <small style="opacity: 0.8;">cancelled 합계</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card" style="background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; border: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div style="font-size: 2.5rem; margin-right: 1rem;">💵</div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1" style="opacity: 0.9;">순 매출</h6>
                                <h4 class="mb-0 fw-bold" id="taxNetRevenue">0원</h4>
                                <small style="opacity: 0.8;" id="taxPaymentMethodBreakdown">(카드: 0원 / 현금: 0원)</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card" style="background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%); color: white; border: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div style="font-size: 2.5rem; margin-right: 1rem;">🏛️</div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1" style="opacity: 0.9;">부가세</h6>
                                <h4 class="mb-0 fw-bold" id="taxTotalVat">0원</h4>
                                <small style="opacity: 0.8;">납부예정액</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 추가 통계 -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h6 class="text-muted mb-2">주문 건수</h6>
                        <h3 class="mb-0 fw-bold" id="taxOrderCount">0건</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h6 class="text-muted mb-2">평균 주문 금액</h6>
                        <h3 class="mb-0 fw-bold" id="taxAvgOrderAmount">0원</h3>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 차트 영역 -->
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title mb-3">매출 추이</h5>
                <canvas id="taxRevenueChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
        
        <!-- 데이터 테이블 -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-3">상세 내역</h5>
                <div class="table-responsive">
                    <table class="table table-hover" id="taxReportTable">
                        <thead>
                            <tr>
                                <th>일자</th>
                                <th>주문번호</th>
                                <th>고객명</th>
                                <th>상품명</th>
                                <th class="text-end">공급가액</th>
                                <th class="text-end">세액</th>
                                <th class="text-end">합계금액</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="taxReportTableBody">
                            <tr>
                                <td colspan="8" class="text-center text-muted">조회 버튼을 클릭하여 데이터를 불러오세요</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
// 세무 리포트 전역 변수
let taxRevenueChart = null;

// 세무 통계 로드
async function loadTaxStats() {
    const reportType = document.querySelector('#taxReportTypeGroup .active')?.dataset.type || 'monthly';
    const year = document.getElementById('taxReportYear')?.value || new Date().getFullYear();
    const month = document.getElementById('taxReportMonth')?.value || new Date().getMonth() + 1;
    const startDate = document.getElementById('taxReportStartDate')?.value;
    const endDate = document.getElementById('taxReportEndDate')?.value;
    
    // URL 파라미터 구성
    const params = new URLSearchParams({
        type: reportType,
        year: year,
        month: month
    });
    
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    
    try {
        const response = await fetch(`/admin/api/tax/stats?${params.toString()}`);
        const result = await response.json();
        
        if (result.success) {
            const data = result.data;
            
            // 요약 카드 업데이트 (4개)
            document.getElementById('taxTotalRevenue').textContent = formatCurrency(data.total_revenue || 0) + '원';
            document.getElementById('taxRefunds').textContent = formatCurrency(data.refunds || 0) + '원';
            document.getElementById('taxNetRevenue').textContent = formatCurrency(data.net_revenue || 0) + '원';
            document.getElementById('taxTotalVat').textContent = formatCurrency(data.total_vat || 0) + '원';
            document.getElementById('taxOrderCount').textContent = formatNumber(data.order_count || 0) + '건';
            
            // 결제 수단별 통계 표시 (3단 분류: 카드/현금/기타)
            const cardTotal = data.card_total || 0;
            const cashTotal = data.cash_total || 0;
            const otherTotal = data.other_total || 0;
            document.getElementById('taxPaymentMethodBreakdown').textContent = 
                `(카드: ${formatCurrency(cardTotal)}원 / 현금: ${formatCurrency(cashTotal)}원 / 기타: ${formatCurrency(otherTotal)}원)`;
            
            // 평균 주문 금액 계산
            const avgAmount = data.order_count > 0 ? Math.round((data.net_revenue || 0) / data.order_count) : 0;
            document.getElementById('taxAvgOrderAmount').textContent = formatCurrency(avgAmount) + '원';
            
            // 차트 업데이트
            updateTaxChart(data.chart_data);
            
            // 테이블 업데이트 (개별 거래 내역)
            updateTaxTable(data.recent_transactions || []);
        } else {
            alert('세무 통계 조회 실패: ' + (result.message || '알 수 없는 오류'));
        }
    } catch (error) {
        console.error('세무 통계 조회 오류:', error);
        alert('세무 통계 조회 중 오류가 발생했습니다.');
    }
}

// 차트 업데이트
function updateTaxChart(chartData) {
    const ctx = document.getElementById('taxRevenueChart');
    if (!ctx) return;
    
    const labels = chartData.map(item => item.date);
    const revenueData = chartData.map(item => item.revenue);
    const supplyData = chartData.map(item => item.supply);
    const vatData = chartData.map(item => item.vat);
    
    if (taxRevenueChart) {
        taxRevenueChart.destroy();
    }
    
    taxRevenueChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '총 매출 (부가세 포함)',
                    data: revenueData,
                    borderColor: 'rgb(16, 185, 129)',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.4
                },
                {
                    label: '공급가액',
                    data: supplyData,
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.4
                },
                {
                    label: '부가세',
                    data: vatData,
                    borderColor: 'rgb(239, 68, 68)',
                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.dataset.label + ': ' + formatCurrency(context.parsed.y) + '원';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return formatCurrency(value) + '원';
                        }
                    }
                }
            }
        }
    });
}

// 테이블 업데이트 (개별 거래 내역)
function updateTaxTable(transactions) {
    const tbody = document.getElementById('taxReportTableBody');
    if (!tbody) return;
    
    if (transactions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">데이터가 없습니다</td></tr>';
        return;
    }
    
    tbody.innerHTML = transactions.map(transaction => {
        const isCancelled = transaction.status === 'cancelled';
        const statusText = isCancelled ? '취소' : '정상';
        const statusClass = isCancelled ? 'text-danger fw-bold' : 'text-success';
        const rowClass = isCancelled ? 'table-danger' : '';
        
        // 날짜 포맷팅
        const dateStr = transaction.created_at ? new Date(transaction.created_at).toLocaleDateString('ko-KR') : '-';
        
        return `
        <tr class="${rowClass}">
            <td>${dateStr}</td>
            <td><code class="text-primary">${transaction.merchant_uid || '-'}</code></td>
            <td>${transaction.username || '알 수 없음'}</td>
            <td>${transaction.product_name || '-'}</td>
            <td class="text-end">${formatCurrency(transaction.supply_price || 0)}원</td>
            <td class="text-end">${formatCurrency(transaction.vat || 0)}원</td>
            <td class="text-end ${isCancelled ? 'text-danger' : ''}"><strong>${formatCurrency(transaction.amount || 0)}원</strong></td>
            <td><span class="${statusClass}">${statusText}</span></td>
        </tr>
    `;
    }).join('');
}

// 엑셀 다운로드
function downloadTaxReport() {
    const reportType = document.querySelector('#taxReportTypeGroup .active')?.dataset.type || 'monthly';
    const year = document.getElementById('taxReportYear')?.value || new Date().getFullYear();
    const month = document.getElementById('taxReportMonth')?.value || new Date().getMonth() + 1;
    const startDate = document.getElementById('taxReportStartDate')?.value;
    const endDate = document.getElementById('taxReportEndDate')?.value;
    
    // URL 파라미터 구성
    const params = new URLSearchParams({
        type: reportType,
        year: year,
        month: month
    });
    
    if (startDate) params.append('start_date', startDate);
    if (endDate) params.append('end_date', endDate);
    
    // 엑셀 파일 다운로드
    window.location.href = `/admin/api/tax/download?${params.toString()}`;
}

// 유틸리티 함수
function formatCurrency(amount) {
    return new Intl.NumberFormat('ko-KR').format(amount || 0);
}

function formatNumber(num) {
    return new Intl.NumberFormat('ko-KR').format(num || 0);
}

// 보고서 유형 버튼 클릭 이벤트
document.addEventListener('DOMContentLoaded', function() {
    const typeButtons = document.querySelectorAll('#taxReportTypeGroup button');
    typeButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            typeButtons.forEach(b => {
                b.classList.remove('active');
                b.classList.add('btn-outline-primary');
            });
            this.classList.add('active');
            this.classList.remove('btn-outline-primary');
        });
    });
    
    // 탭 전환 시 자동 로드
    const taxReportTab = document.querySelector('[data-target="tax-report"]');
    if (taxReportTab) {
        taxReportTab.addEventListener('click', function() {
            setTimeout(() => {
                if (!document.getElementById('tax-report').classList.contains('hidden')) {
                    loadTaxStats();
                }
            }, 100);
        });
    }
    
    // 초기 날짜 설정
    const now = new Date();
    document.getElementById('taxReportYear').value = now.getFullYear();
    document.getElementById('taxReportMonth').value = now.getMonth() + 1;
});
</script>
