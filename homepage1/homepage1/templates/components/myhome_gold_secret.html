<!-- 골드 전용 고객 관리 -->
<div class="profile-card gold-card" id="gold-customer-card">
  <div class="gold-toolbar d-flex justify-content-between align-items-center">
    <div class="gold-toolbar-left d-flex align-items-center">
      <span class="gold-icon">💎</span>
      <div class="gold-toolbar-copy">
        <span class="gold-toolbar-title">VIP 고객 관리</span>
        <span class="gold-toolbar-count">총 <span id="gold-summary-count">0명</span></span>
      </div>
    </div>
    <div class="gold-toolbar-right d-flex align-items-center">
      <input type="text" id="gold-search" class="gold-search-input" placeholder="업체명, 사업자번호, 대표자명 검색">
      <button class="btn btn-secondary gold-search-btn" id="gold-search-btn">검색</button>
      <button class="btn btn-primary gold-add-btn" id="gold-add-row">+ 새 고객 추가</button>
    </div>
  </div>
  <div id="gold-sheet-wrap" class="gold-sheet-collapsible">

    <!-- Excel 시트 형태 테이블 -->
    <div class="gold-sheet-wrapper">
      <table class="table gold-customer-sheet">
        <colgroup>
          <col>
          <col>
          <col>
          <col>
          <col>
          <col>
          <col>
          <col>
        </colgroup>
        <thead class="gold-head">
          <tr>
            <th>대표자명</th>
            <th>업체명</th>
            <th>사업자등록번호</th>
            <th>주소</th>
            <th>이메일</th>
            <th>업태</th>
            <th>종목</th>
            <th>관리</th>
          </tr>
        </thead>
          <tbody id="gold-tbody">
            <tr><td colspan="8" class="gold-empty-row">데이터가 없습니다</td></tr>
          </tbody>
        </table>
      </div>
    <!-- 페이지네이션 -->
    <div id="gold-pagination" class="gold-pagination"></div>
      </div>
    </div>
