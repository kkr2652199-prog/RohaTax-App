<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상점 페이지 3D 효과 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 100px 20px;
        }

        /* 상점 페이지 헤더 스타일 */
        .shop-hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .shop-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .shop-hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .shop-hero-subtitle {
            font-size: 1.1rem;
            color: #6b7280;
        }

        /* 이벤트 섹션 */
        .event-section {
            max-width: 1400px;
            margin: 0 auto 80px;
        }

        .event-section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .event-section-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .event-section-subtitle {
            font-size: 1rem;
            color: #6b7280;
        }

        /* 이벤트 그리드 - 실제 상점 페이지와 동일한 레이아웃 */
        .event-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            flex-wrap: wrap;
        }

        /* 3D 상자 컨테이너 - 크기 증가 */
        .event-card-wrapper {
            position: relative;
            width: 400px;
            height: 600px;
            cursor: pointer;
        }

        .gift-box-canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .event-card-wrapper:hover .gift-box-canvas {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        /* 구매 버튼 오버레이 (상자 위에 표시) */
        .purchase-button-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }

        .btn-purchase-3d {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
        }

        .btn-purchase-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-purchase-3d:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 이벤트 종료 상태 */
        .event-card-wrapper.ended .btn-purchase-3d {
            background: #9ca3af;
        }

        /* 모달 시뮬레이션 (테스트용) */
        .test-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .test-modal.active {
            display: flex;
        }

        .test-modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
        }

        .test-modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .test-modal-content p {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .test-modal-close {
            background: #10B981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
    <!-- Three.js 및 GSAP 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>
    <!-- 상점 페이지 헤더 -->
    <div class="shop-hero">
        <div class="shop-hero-badge">
            <span>⚡</span>
            <span>ROHA TAX SHOP</span>
        </div>
        <h1 class="shop-hero-title">상품 구매</h1>
        <p class="shop-hero-subtitle">필요에 따라 토큰형/기간형 이벤트와 정식 요금제를 선택하세요</p>
    </div>

    <!-- 이벤트 섹션 -->
    <section class="event-section">
        <div class="event-section-header">
            <h2 class="event-section-title">🎁 신규 회원 한정 혜택</h2>
            <p class="event-section-subtitle">가입 즉시 토큰 혹은 기간 혜택을 받아보세요</p>
        </div>
        <div class="event-grid">
            <!-- 토큰 이벤트 상자 -->
            <div class="event-card-wrapper" 
                 data-product-id="1"
                 data-product-name="WELCOME EVENT"
                 data-product-type="event"
                 data-product-price="0"
                 data-product-token="100"
                 data-is-active="true">
                <canvas class="gift-box-canvas" id="eventBox1"></canvas>
                <div class="purchase-button-overlay">
                    <button class="btn-purchase-3d" data-box-id="1">구매하기</button>
                </div>
            </div>

            <!-- 기간 이벤트 상자 -->
            <div class="event-card-wrapper" 
                 data-product-id="2"
                 data-product-name="무료 체험"
                 data-product-type="event_period"
                 data-product-price="0"
                 data-product-duration="30"
                 data-is-active="true">
                <canvas class="gift-box-canvas" id="eventBox2"></canvas>
                <div class="purchase-button-overlay">
                    <button class="btn-purchase-3d" data-box-id="2">구매하기</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 테스트용 모달 -->
    <div class="test-modal" id="testModal">
        <div class="test-modal-content">
            <h2 id="modalProductName">상품명</h2>
            <p id="modalProductInfo">상품 정보</p>
            <button class="test-modal-close" onclick="closeTestModal()">닫기</button>
        </div>
    </div>

    <script>
        // 테스트용 제품 데이터 (실제 상점 페이지에서는 서버에서 받아옴)
        const eventProducts = [
            {
                id: 1,
                name: 'WELCOME EVENT',
                type: 'event',
                token_amount: 100,
                is_active: true,
                boxColor: 0xff4d7a, // 분홍색
                ribbonColor: 0xffffff
            },
            {
                id: 2,
                name: '무료 체험',
                type: 'event_period',
                duration_days: 30,
                is_active: true,
                boxColor: 0x3b82f6, // 파란색
                ribbonColor: 0xffffff
            }
        ];

        // 텍스트 텍스처 생성 함수 - 현대적이고 선명한 디자인
        function createTextTexture(title, subtitle, boxColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const context = canvas.getContext('2d');
            
            // 현대적인 배경 - 미니멀하고 깔끔한 그라데이션
            const rgb = [
                (boxColor >> 16) & 255,
                (boxColor >> 8) & 255,
                boxColor & 255
            ];
            // 부드러운 그라데이션 (현대적 느낌)
            const gradient = context.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.95)`);
            gradient.addColorStop(0.5, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 1.0)`);
            gradient.addColorStop(1, `rgba(${Math.max(0, rgb[0] - 10)}, ${Math.max(0, rgb[1] - 10)}, ${Math.max(0, rgb[2] - 10)}, 0.95)`);
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 고품질 렌더링 설정
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            
            // 메인 타이틀 - 매우 선명하고 크게
            context.font = "900 140px 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif";
            
            // 텍스트 선명도를 위한 다중 레이어 그림자
            // 1. 강한 외곽선 (가독성 최대화)
            context.strokeStyle = "#000000";
            context.lineWidth = 20;
            context.lineJoin = 'round';
            context.miterLimit = 2;
            context.strokeText(title, canvas.width / 2, canvas.height / 2 - 60);
            
            // 2. 중간 외곽선
            context.strokeStyle = "#FFFFFF";
            context.lineWidth = 14;
            context.strokeText(title, canvas.width / 2, canvas.height / 2 - 60);
            
            // 3. 메인 텍스트 (밝은 금색)
            context.fillStyle = "#FFE135"; // 더 밝은 금색
            context.shadowColor = 'rgba(255, 225, 53, 0.8)';
            context.shadowBlur = 25;
            context.shadowOffsetX = 0;
            context.shadowOffsetY = 0;
            context.fillText(title, canvas.width / 2, canvas.height / 2 - 60);
            
            // 서브타이틀 - 선명하게
            if (subtitle) {
                context.font = "700 80px 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif";
                
                // 외곽선
                context.strokeStyle = "#000000";
                context.lineWidth = 16;
                context.strokeText(subtitle, canvas.width / 2, canvas.height / 2 + 60);
                
                context.strokeStyle = "#FFFFFF";
                context.lineWidth = 10;
                context.strokeText(subtitle, canvas.width / 2, canvas.height / 2 + 60);
                
                // 메인 텍스트
                context.fillStyle = "#FFFFFF"; // 흰색으로 변경 (더 선명)
                context.shadowColor = 'rgba(0, 0, 0, 0.5)';
                context.shadowBlur = 20;
                context.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 60);
            }
            
            // 현대적인 미니멀 테두리 (얇고 세련되게)
            context.strokeStyle = "rgba(255, 255, 255, 0.4)";
            context.lineWidth = 3;
            context.shadowColor = 'transparent';
            context.shadowBlur = 0;
            const cornerRadius = 30;
            context.beginPath();
            context.moveTo(cornerRadius, 40);
            context.lineTo(canvas.width - cornerRadius, 40);
            context.quadraticCurveTo(canvas.width - 40, 40, canvas.width - 40, cornerRadius);
            context.lineTo(canvas.width - 40, canvas.height - cornerRadius);
            context.quadraticCurveTo(canvas.width - 40, canvas.height - 40, canvas.width - cornerRadius, canvas.height - 40);
            context.lineTo(cornerRadius, canvas.height - 40);
            context.quadraticCurveTo(40, canvas.height - 40, 40, canvas.height - cornerRadius);
            context.lineTo(40, cornerRadius);
            context.quadraticCurveTo(40, 40, cornerRadius, 40);
            context.closePath();
            context.stroke();
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = true;
            texture.anisotropy = 16;
            return texture;
        }

        // 3D 상자 생성 함수
        function createGiftBox(canvasId, product) {
            const canvas = document.getElementById(canvasId);
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            // Scene, Camera, Renderer 설정
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);
            scene.fog = new THREE.Fog(0xf0f2f5, 15, 60);

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            // 텍스트가 정면에서 선명하게 보이도록 각도 최적화
            camera.position.set(0, 3.5, 15);
            camera.lookAt(0, 0.3, 0); // 텍스트가 정면에 오도록

            const renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                alpha: true,
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.5;
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            // 현대적인 조명 설정 - 부드럽고 자연스러운 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            // 메인 조명 - 부드러운 그림자
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(4, 10, 6);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 4096;
            dirLight.shadow.mapSize.height = 4096;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.camera.left = -12;
            dirLight.shadow.camera.right = 12;
            dirLight.shadow.camera.top = 12;
            dirLight.shadow.camera.bottom = -12;
            dirLight.shadow.bias = -0.0001;
            dirLight.shadow.radius = 8; // 부드러운 그림자
            scene.add(dirLight);

            // 보조 조명 - 텍스트 가독성 향상
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
            fillLight.position.set(-3, 5, 4);
            scene.add(fillLight);

            // 상단 조명 - 뚜껑 하이라이트
            const topLight = new THREE.SpotLight(0xffffff, 0.6);
            topLight.position.set(0, 12, 0);
            topLight.angle = Math.PI / 6;
            topLight.penumbra = 0.5;
            topLight.decay = 2;
            topLight.distance = 20;
            topLight.target.position.set(0, 0, 0);
            scene.add(topLight);
            scene.add(topLight.target);

            // 전면 조명 - 텍스트 선명도 향상
            const frontLight = new THREE.PointLight(0xffffff, 0.5, 25);
            frontLight.position.set(0, 2, 8);
            scene.add(frontLight);

            // 현대적인 고급 재질 - 미니멀하고 세련된 느낌
            const boxMaterial = new THREE.MeshPhysicalMaterial({
                color: product.boxColor,
                metalness: 0.15, // 약간의 메탈릭 (현대적 느낌)
                roughness: 0.25, // 부드러운 반짝임 (과하지 않게)
                clearcoat: 0.9, // 클리어코트
                clearcoatRoughness: 0.1, // 부드러운 클리어코트
                emissive: product.boxColor,
                emissiveIntensity: 0.08, // 은은한 발광
                side: THREE.DoubleSide,
                envMapIntensity: 1.0
            });

            // 현대적인 리본 재질 - 미니멀하고 고급스러운
            const ribbonMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, // 흰색 리본 (현대적)
                metalness: 0.1,
                roughness: 0.3,
                clearcoat: 0.8,
                clearcoatRoughness: 0.2,
                emissive: 0xffffff,
                emissiveIntensity: 0.1,
                envMapIntensity: 1.0
            });

            // 금색 액센트 재질 (리본 보 등)
            const goldAccentMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                metalness: 0.8,
                roughness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                emissive: 0xffd700,
                emissiveIntensity: 0.2,
                envMapIntensity: 1.3
            });

            // 상자 모델링 - 크기 증가 및 현대적 디자인
            const boxSize = 5.5; // 더 크게
            const wallThickness = 0.12;
            const cornerRadius = 0.4; // 둥근 모서리

            // 상자 본체 - 현대적인 둥근 모서리
            const baseGroup = new THREE.Group();
            
            // 바닥 - 둥근 모서리
            const bottomGeo = new THREE.BoxGeometry(boxSize, wallThickness, boxSize, 16, 16, 16);
            const bottomMesh = new THREE.Mesh(bottomGeo, boxMaterial);
            bottomMesh.position.y = -boxSize/2 + wallThickness/2;
            bottomMesh.castShadow = true;
            bottomMesh.receiveShadow = true;
            baseGroup.add(bottomMesh);

            // 앞면 (텍스트 적용) - 정면 강조, 고해상도
            const subtitle = product.type === 'event' 
                ? `신규 가입 혜택 (${product.token_amount}토큰)`
                : `신규 가입 혜택 (${product.duration_days}일)`;
            const frontGeo = new THREE.BoxGeometry(boxSize, boxSize, wallThickness, 16, 16, 1);
            const frontMaterial = boxMaterial.clone();
            frontMaterial.map = createTextTexture(product.name, subtitle, product.boxColor);
            const frontMesh = new THREE.Mesh(frontGeo, frontMaterial);
            frontMesh.position.set(0, 0, boxSize/2 - wallThickness/2);
            frontMesh.castShadow = true;
            frontMesh.receiveShadow = true;
            baseGroup.add(frontMesh);

            // 뒷면, 왼쪽, 오른쪽
            const backMesh = new THREE.Mesh(frontGeo, boxMaterial);
            backMesh.position.set(0, 0, -boxSize/2 + wallThickness/2);
            backMesh.castShadow = true;
            baseGroup.add(backMesh);

            const sideGeo = new THREE.BoxGeometry(wallThickness, boxSize, boxSize - wallThickness*2, 1, 16, 16);
            const leftMesh = new THREE.Mesh(sideGeo, boxMaterial);
            leftMesh.position.set(-boxSize/2 + wallThickness/2, 0, 0);
            leftMesh.castShadow = true;
            baseGroup.add(leftMesh);

            const rightMesh = new THREE.Mesh(sideGeo, boxMaterial);
            rightMesh.position.set(boxSize/2 - wallThickness/2, 0, 0);
            rightMesh.castShadow = true;
            baseGroup.add(rightMesh);

            // 상자 회전 (텍스트가 정면에서 잘 보이도록)
            baseGroup.rotation.y = -0.08; // 거의 정면
            scene.add(baseGroup);

            // 경첩 위치 (상자 뒤쪽 중앙)
            const hingePosition = {
                x: 0,
                y: boxSize/2,
                z: -boxSize/2
            };

            // 경첩 메시 생성 (자연스러운 연결)
            const hingeGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16);
            const hingeMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x888888,
                metalness: 0.9,
                roughness: 0.1,
                clearcoat: 1.0
            });
            const hinge1 = new THREE.Mesh(hingeGeo, hingeMaterial);
            hinge1.position.set(hingePosition.x - 0.15, hingePosition.y, hingePosition.z);
            hinge1.rotation.z = Math.PI / 2;
            baseGroup.add(hinge1);
            
            const hinge2 = new THREE.Mesh(hingeGeo, hingeMaterial);
            hinge2.position.set(hingePosition.x + 0.15, hingePosition.y, hingePosition.z);
            hinge2.rotation.z = Math.PI / 2;
            baseGroup.add(hinge2);

            // 뚜껑 그룹 (경첩 중심으로 회전)
            const lidPivotGroup = new THREE.Group();
            lidPivotGroup.position.set(hingePosition.x, hingePosition.y, hingePosition.z);
            lidPivotGroup.rotation.y = baseGroup.rotation.y;
            scene.add(lidPivotGroup);

            const lidGroup = new THREE.Group();
            lidGroup.position.set(0, 0, boxSize/2); // 경첩에서 앞으로 이동
            lidPivotGroup.add(lidGroup);

            // 뚜껑 - 현대적인 둥근 모서리
            const lidGeo = new THREE.BoxGeometry(boxSize + 0.25, wallThickness * 2.5, boxSize + 0.25, 16, 16, 16);
            const lidMaterial = boxMaterial.clone();
            lidMaterial.clearcoat = 0.95;
            lidMaterial.clearcoatRoughness = 0.08;
            const lidMesh = new THREE.Mesh(lidGeo, lidMaterial);
            lidMesh.castShadow = true;
            lidMesh.receiveShadow = true;
            lidGroup.add(lidMesh);

            // 현대적인 미니멀 리본 디자인
            // 가로 리본 - 얇고 세련되게
            const ribbonWidth = 0.4;
            const ribbonGeo1 = new THREE.BoxGeometry(boxSize + 0.3, wallThickness * 2.8, ribbonWidth, 16, 16, 16);
            const ribbon1 = new THREE.Mesh(ribbonGeo1, ribbonMaterial);
            ribbon1.position.y = 0.02;
            lidGroup.add(ribbon1);

            // 세로 리본
            const ribbonGeo2 = new THREE.BoxGeometry(ribbonWidth, wallThickness * 2.8, boxSize + 0.3, 16, 16, 16);
            const ribbon2 = new THREE.Mesh(ribbonGeo2, ribbonMaterial);
            ribbon2.position.y = 0.02;
            lidGroup.add(ribbon2);

            // 현대적인 리본 보 (매듭) - 미니멀하고 세련된 형태
            const bowSize = 0.6;
            // 매듭을 여러 구체로 구성 (더 현대적)
            const bowGroup = new THREE.Group();
            
            // 중앙 구체
            const bowCenter = new THREE.Mesh(
                new THREE.SphereGeometry(bowSize * 0.7, 32, 32),
                goldAccentMaterial
            );
            bowCenter.position.set(0, wallThickness * 2.5 + bowSize * 0.5, 0);
            bowGroup.add(bowCenter);
            
            // 좌우 장식
            const bowLeft = new THREE.Mesh(
                new THREE.SphereGeometry(bowSize * 0.5, 24, 24),
                ribbonMaterial
            );
            bowLeft.position.set(-bowSize * 0.6, wallThickness * 2.5 + bowSize * 0.4, 0);
            bowGroup.add(bowLeft);
            
            const bowRight = new THREE.Mesh(
                new THREE.SphereGeometry(bowSize * 0.5, 24, 24),
                ribbonMaterial
            );
            bowRight.position.set(bowSize * 0.6, wallThickness * 2.5 + bowSize * 0.4, 0);
            bowGroup.add(bowRight);
            
            bowGroup.castShadow = true;
            lidGroup.add(bowGroup);
            
            const bow = bowGroup; // 호환성을 위해

            // 바닥
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xf0f2f5,
                roughness: 0.6,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -boxSize/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 파티클 시스템
            const particleCount = 300;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];
            const colors = [];

            for(let i = 0; i < particleCount; i++) {
                positions.push(0, 0, 0);
                velocities.push(
                    (Math.random() - 0.5) * 0.8,
                    Math.random() * 0.8 + 0.3,
                    (Math.random() - 0.5) * 0.8
                );
                const color = new THREE.Color();
                const hue = Math.random() < 0.5 
                    ? Math.random() * 0.1 + 0.1
                    : Math.random() * 0.05 + 0.9;
                color.setHSL(hue, 1, 0.5 + Math.random() * 0.5);
                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.2,
                vertexColors: true,
                transparent: true,
                opacity: 0,
                sizeAttenuation: true
            });

            const particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            // 상호작용
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isOpened = false;

            function onMouseMove(event) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([lidMesh, ribbon1, ribbon2, bow]);
                
                if (intersects.length > 0 && !isOpened && product.is_active) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'default';
                }
            }

            function onClick(event) {
                if (isOpened || !product.is_active) return;

                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([lidMesh, ribbon1, ribbon2, bow, baseGroup.children]);
                
                if (intersects.length > 0) {
                    openBox();
                }
            }

            // openBox 함수를 외부에서 접근 가능하도록 저장
            const openBox = function() {
                if (isOpened) return;
                isOpened = true;

                // GSAP 애니메이션: 뚜껑 열기 (경첩 중심으로 자연스럽게)
                gsap.to(lidPivotGroup.rotation, {
                    x: -Math.PI / 1.4, // 약 128도 (더 자연스럽게)
                    duration: 2.2,
                    ease: "power2.out" // 부드러운 감속
                });

                // 파티클 효과
                particleMaterial.opacity = 1;
                animateParticles = true;
                
                // 구매 모달 열기 (실제 상점에서는 shop.js의 모달 열기 함수 호출)
                setTimeout(() => {
                    openPurchaseModal(product);
                }, 500);
            };

            // 인스턴스에 저장
            boxInstances[product.id] = { openBox: openBox };

            // 파티클 애니메이션
            let animateParticles = false;
            const posAttribute = geometry.attributes.position;
            
            function updateParticles() {
                if (!animateParticles) return;

                for (let i = 0; i < particleCount; i++) {
                    const x = posAttribute.getX(i) + velocities[i * 3];
                    const y = posAttribute.getY(i) + velocities[i * 3 + 1];
                    const z = posAttribute.getZ(i) + velocities[i * 3 + 2];
                    velocities[i * 3 + 1] -= 0.003;
                    velocities[i * 3] *= 0.99;
                    velocities[i * 3 + 2] *= 0.99;
                    posAttribute.setXYZ(i, x, y, z);
                }

                posAttribute.needsUpdate = true;
                
                if (particleMaterial.opacity > 0) {
                    particleMaterial.opacity -= 0.003;
                } else {
                    animateParticles = false;
                }
            }

            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onClick);
            
            // 리사이즈 핸들러
            function handleResize() {
                const newWidth = canvas.offsetWidth;
                const newHeight = canvas.offsetHeight;
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(newWidth, newHeight);
            }

            window.addEventListener('resize', handleResize);

            // 렌더 루프
            function animate() {
                requestAnimationFrame(animate);
                updateParticles();
                renderer.render(scene, camera);
            }

            animate();
        }

        // 구매 모달 열기 (테스트용)
        function openPurchaseModal(product) {
            const modal = document.getElementById('testModal');
            const productName = document.getElementById('modalProductName');
            const productInfo = document.getElementById('modalProductInfo');
            
            productName.textContent = product.name;
            if (product.type === 'event') {
                productInfo.textContent = `${product.token_amount}개의 무료 토큰이 즉시 지급됩니다.`;
            } else {
                productInfo.textContent = `${product.duration_days}일 동안 무료 체험이 제공됩니다.`;
            }
            
            modal.classList.add('active');
        }

        function closeTestModal() {
            document.getElementById('testModal').classList.remove('active');
        }

        // 상자 인스턴스 저장 (구매 버튼에서 접근하기 위해)
        const boxInstances = {};

        // 구매 버튼 클릭 이벤트 - 상자 뚜껑 열기
        document.querySelectorAll('.btn-purchase-3d').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const boxId = parseInt(btn.dataset.boxId);
                const product = eventProducts.find(p => p.id === boxId);
                if (product && product.is_active) {
                    // 상자 뚜껑 열기
                    if (boxInstances[boxId] && boxInstances[boxId].openBox) {
                        boxInstances[boxId].openBox();
                    }
                }
            });
        });

        // 페이지 로드 후 상자 생성
        window.addEventListener('load', () => {
            eventProducts.forEach(product => {
                createGiftBox(`eventBox${product.id}`, product);
            });
        });
    </script>
</body>
</html>
