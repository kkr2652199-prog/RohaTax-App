<!-- 가격 정책 미리보기 섹션 -->
<section class="pricing-preview-section" id="pricing">
    <div class="container">
        <div class="section-header">
            <h2>합리적인 멤버십</h2>
            <p>규모에 맞는 최적의 플랜을 선택하세요</p>
        </div>
        <div class="pricing-preview-grid">
            <!-- Standard -->
            <div class="pricing-preview-card">
                <h3 class="pricing-preview-title">Standard</h3>
                <div class="pricing-preview-price">
                    <span class="price-amount">500원</span>
                    <span class="price-unit">/건</span>
                </div>
                <p class="pricing-preview-feature">급할 때 한 건씩</p>
            </div>
            <!-- Premium -->
            <div class="pricing-preview-card featured">
                <div class="pricing-badge">BEST</div>
                <h3 class="pricing-preview-title">Premium</h3>
                <div class="pricing-preview-price">
                    <span class="price-amount">25,000원</span>
                    <span class="price-unit">/월</span>
                </div>
                <p class="pricing-preview-feature">정산서가 쌓여있을 때</p>
            </div>
            <!-- Gold -->
            <div class="pricing-preview-card">
                <h3 class="pricing-preview-title">Gold</h3>
                <div class="pricing-preview-price">
                    <span class="price-amount">70,000원</span>
                    <span class="price-unit">/월</span>
                </div>
                <p class="pricing-preview-feature">세무사 등 대리 발급 전문</p>
            </div>
        </div>
        <div class="pricing-preview-action">
            <a href="/shop" class="btn-outline">멤버십 전체 보기</a>
        </div>
    </div>
</section>
