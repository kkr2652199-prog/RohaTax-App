<!-- CTA 섹션 -->
<section class="cta-section">
    <div class="container">
        <div class="cta-content">
            <h2 class="cta-title">지금 바로 시작하세요!</h2>
            <p class="cta-subtitle">3일 무료 체험으로 로하택스의 강력함을 경험해보세요</p>
            <div class="cta-actions">
                <button class="btn-primary" onclick="window.location.href='/shop'">
                    무료로 시작하기
                </button>
                <button class="btn-outline" onclick="window.location.href='/shop#regular-products'">
                    바로 체험하기
                </button>
                <button class="btn-text" onclick="document.querySelector('.company-section').scrollIntoView({behavior: 'smooth'})">
                    상담 문의
                </button>
            </div>
            <div class="cta-guarantee">
                <span class="guarantee-text">30일 무조건 환불 보장</span>
            </div>
        </div>
    </div>
</section>
