<!-- Use Cases 섹션 -->
<section class="use-cases-section">
    <div class="container">
        <div class="section-header">
            <h2>업종별 맞춤 솔루션</h2>
            <p>규모와 업종에 상관없이 최적화된 처리</p>
        </div>
        <div class="use-cases-grid">
            <!-- 배달대행사 -->
            <div class="use-case-card">
                <i data-lucide="bike" class="use-case-icon"></i>
                <h3 class="use-case-title">배달대행사</h3>
                <p class="use-case-description">
                    300명 고객을 6장으로 처리. 건별 25시간 → 일괄 1시간으로 단축. 24시간 절약의 압도적 효율성.
                </p>
                <span class="use-case-metric">300건 → 6장, 24시간 절약</span>
            </div>
            <!-- 물류/유통 -->
            <div class="use-case-card">
                <i data-lucide="truck" class="use-case-icon"></i>
                <h3 class="use-case-title">물류/유통</h3>
                <p class="use-case-description">
                    월 1,000건 대량 처리. 2분이면 완료. 청크 단위 처리로 메모리 오버플로우 완전 차단.
                </p>
                <span class="use-case-metric">1,000건 → 2분 완료</span>
            </div>
            <!-- 소상공인 -->
            <div class="use-case-card">
                <i data-lucide="store" class="use-case-icon"></i>
                <h3 class="use-case-title">소상공인</h3>
                <p class="use-case-description">
                    30건도 1장으로 간단하게. 2시간 20분 절약. 소상공인도 일괄 발행의 혜택을 누리세요.
                </p>
                <span class="use-case-metric">30건 → 1장, 2시간 20분 절약</span>
            </div>
        </div>
    </div>
</section>
