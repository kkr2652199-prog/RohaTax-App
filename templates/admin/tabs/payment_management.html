<!-- 결제 관리 탭 - 금융 대시보드 스타일 -->
<section class="panel hidden" id="payment-management">
    <div class="hd">결제 관리</div>
    <div class="bd">
        <!-- 상단: KPI 카드 (4개) -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card payment-kpi-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="payment-kpi-icon" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
                                💰
                            </div>
                            <div class="ms-3 flex-grow-1">
                                <h6 class="text-muted mb-1 small">오늘 매출</h6>
                                <h4 class="mb-0 fw-bold" id="todayRevenue">0원</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card payment-kpi-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="payment-kpi-icon" style="background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);">
                                📊
                            </div>
                            <div class="ms-3 flex-grow-1">
                                <h6 class="text-muted mb-1 small">이번 달 매출</h6>
                                <h4 class="mb-0 fw-bold" id="monthRevenue">0원</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card payment-kpi-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="payment-kpi-icon" style="background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);">
                                🎯
                            </div>
                            <div class="ms-3 flex-grow-1">
                                <h6 class="text-muted mb-1 small">오늘 결제 건수</h6>
                                <h4 class="mb-0 fw-bold" id="todayCount">0건</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card payment-kpi-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="payment-kpi-icon" style="background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);">
                                ⚠️
                            </div>
                            <div class="ms-3 flex-grow-1">
                                <h6 class="text-muted mb-1 small">환불 요청</h6>
                                <h4 class="mb-0 fw-bold" id="refundCount">0건</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 중단: 그래프 & 최신 결제 피드 -->
        <div class="row g-3 mb-4">
            <!-- 좌측: 매출 추이 그래프 (Col-8) -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold">매출 추이</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="revenueChart" height="300"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- 우측: 최신 결제 피드 (Col-4) -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold">최신 결제 피드</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="recentPaymentsFeed" class="list-group list-group-flush">
                            <div class="text-center py-4 text-muted">
                                <small>결제 데이터를 불러오는 중...</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 하단: 거래 장부 테이블 -->
        <div class="card">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">거래 장부</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-success" onclick="openCreatePaymentModal()">
                        <i class="bi bi-plus-circle"></i> 결제 생성
                    </button>
                    <select id="paymentStatusFilter" class="form-select form-select-sm" style="width: auto;" title="결제 상태 필터">
                        <option value="">전체 상태</option>
                        <option value="pending">대기중</option>
                        <option value="completed">완료</option>
                        <option value="failed">실패</option>
                        <option value="cancelled">취소</option>
                    </select>
                    <button class="btn btn-sm btn-primary" onclick="loadPayments()">
                        <i class="bi bi-arrow-clockwise"></i> 새로고침
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="paymentLedgerTable">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 120px;">주문번호</th>
                                <th style="width: 100px;">유저 ID</th>
                                <th style="width: 100px;">상품</th>
                                <th style="width: 120px;" class="text-end">금액</th>
                                <th style="width: 100px;">토큰</th>
                                <th style="width: 100px;">상태</th>
                                <th style="width: 150px;">PG사</th>
                                <th style="width: 180px;">일시</th>
                                <th style="width: 120px;" class="text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="paymentLedgerBody">
                            <tr>
                                <td colspan="9" class="text-center py-4 text-muted">
                                    결제 데이터를 불러오는 중...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 페이징 -->
                <div class="d-flex justify-content-between align-items-center p-3 border-top">
                    <div class="text-muted small">
                        <span id="paymentPaginationInfo">전체 0건</span>
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="paymentPagination">
                            <!-- 페이징 버튼이 여기에 동적으로 추가됨 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 결제 상세보기 모달 -->
<div class="modal fade" id="paymentDetailModal" tabindex="-1" aria-labelledby="paymentDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="paymentDetailModalLabel">결제 상세 정보</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="paymentDetailContent">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">결제 정보를 불러오는 중...</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer" id="paymentDetailFooter">
                <!-- 결제 취소 버튼이 여기에 동적으로 추가됨 -->
            </div>
        </div>
    </div>
</div>

<!-- 결제 생성 모달 -->
<div class="modal fade" id="createPaymentModal" tabindex="-1" aria-labelledby="createPaymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createPaymentModalLabel">결제 생성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="createPaymentForm">
                    <div class="mb-3">
                        <label for="createPaymentUserId" class="form-label">유저 ID <span class="text-danger">*</span></label>
                        <input 
                            type="number" 
                            class="form-control" 
                            id="createPaymentUserId" 
                            name="user_id" 
                            min="1" 
                            required
                            placeholder="사용자 ID를 입력하세요"
                        >
                    </div>
                    
                    <div class="mb-3">
                        <label for="createPaymentProductId" class="form-label">상품 선택 <span class="text-danger">*</span></label>
                        <select 
                            class="form-select" 
                            id="createPaymentProductId" 
                            name="product_id" 
                            required
                        >
                            <option value="">상품을 선택하세요</option>
                            <!-- 상품 목록이 여기에 동적으로 추가됨 -->
                        </select>
                    </div>
                    
                    <div class="mb-3" id="quantityFieldContainer" style="display: none;">
                        <label for="createPaymentQuantity" class="form-label">수량 <span class="text-danger">*</span></label>
                        <input 
                            type="number" 
                            class="form-control" 
                            id="createPaymentQuantity" 
                            name="quantity" 
                            min="1" 
                            value="1"
                            placeholder="수량을 입력하세요"
                        >
                        <small class="text-muted">Standard 상품만 수량 입력이 가능합니다.</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">예상 결제액</label>
                        <div class="alert alert-info mb-0" id="expectedPaymentAmount">
                            상품을 선택하면 예상 결제액이 표시됩니다.
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="submitCreatePayment()">생성</button>
            </div>
        </div>
    </div>
</div>
