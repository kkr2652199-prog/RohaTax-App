<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로하택스 - 가구 디자인 스튜디오</title>
    
    <!-- Import Map (ES6 모듈 지원) -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .viewer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .viewer-title {
            font-size: 18px;
            font-weight: 600;
            color: #10B981;
        }
        
        .back-link {
            padding: 8px 16px;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(55, 65, 81, 0.4);
        }
        
        #viewer-canvas {
            width: 100%;
            height: 100%;
            background: #2a2a2a;
            border: 2px solid #10B981;
            border-radius: 8px;
            min-height: 500px;
        }
        
        .control-panel {
            width: 350px;
            background: #2a2a2a;
            padding: 20px;
            border-left: 2px solid #10B981;
            overflow-y: auto;
        }
        
        .panel-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #10B981;
            text-align: center;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .test-button {
            padding: 14px 20px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        .test-button:active {
            transform: translateY(0);
        }
        
        .test-button.gold {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }
        
        .test-button.standard {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
        }
        
        .test-button.premium {
            background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
        }
        
        .test-button.event {
            background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%);
        }
        
        .info-section {
            margin-top: 30px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        
        .info-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #10B981;
        }
        
        .info-text {
            font-size: 12px;
            color: #aaaaaa;
            line-height: 1.6;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            font-size: 12px;
            color: #10B981;
            border: 1px solid #10B981;
        }
        
        /* 초기화 버튼 스타일 */
        .clear-button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .clear-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        
        /* 아코디언 스타일 */
        .accordion-group {
            margin-bottom: 15px;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        .accordion-group details {
            width: 100%;
        }
        
        .accordion-group summary {
            padding: 14px 20px;
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            list-style: none;
            -webkit-user-select: none;
            user-select: none;
            transition: all 0.3s ease;
        }
        
        .accordion-group summary::-webkit-details-marker {
            display: none;
        }
        
        .accordion-group summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 10px;
            transition: transform 0.3s ease;
        }
        
        .accordion-group details[open] summary::before {
            transform: rotate(90deg);
        }
        
        .accordion-group summary:hover {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
        }
        
        .accordion-content {
            padding: 12px 20px;
            background: #1a1a1a;
        }
        
        /* 크기 조절 슬라이더 스타일 */
        .size-control {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        
        .size-control-label {
            font-size: 14px;
            font-weight: 600;
            color: #10B981;
            margin-bottom: 10px;
            display: block;
        }
        
        .size-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #3a3a3a;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #10B981;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .size-slider::-webkit-slider-thumb:hover {
            background: #059669;
            transform: scale(1.2);
        }
        
        .size-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #10B981;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }
        
        .size-slider::-moz-range-thumb:hover {
            background: #059669;
            transform: scale(1.2);
        }
        
        .size-value {
            margin-top: 8px;
            font-size: 12px;
            color: #aaaaaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="viewer-header">
            <div class="viewer-title">🎨 3D 가구 디자인 스튜디오</div>
            <a href="/admin" class="back-link">⬅️ 대시보드로 돌아가기</a>
        </div>
        <div id="viewer-canvas"></div>
    </div>
    
    <div class="control-panel">
        <div class="panel-title">🎛️ 제어 패널</div>
        
        <!-- 초기화 버튼 -->
        <button id="btn-clear" class="clear-button">
            🔄 화면 초기화
        </button>
        
        <!-- 아코디언 그룹: 유료 상품 -->
        <div class="accordion-group">
            <details>
                <summary>📂 유료 상품 목록</summary>
                <div class="accordion-content">
                    <div class="button-group">
                        <button id="btn-gold" class="test-button gold">
                            👑 Gold Crown
                        </button>
                        <button id="btn-standard" class="test-button standard">
                            🪙 Standard Coin
                        </button>
                        <button id="btn-premium" class="test-button premium">
                            🎲 Premium Cube
                        </button>
                    </div>
                </div>
            </details>
        </div>
        
        <!-- 아코디언 그룹: 이벤트 상품 -->
        <div class="accordion-group">
            <details>
                <summary>🎁 이벤트 상품 목록</summary>
                <div class="accordion-content">
                    <div class="button-group">
                        <button id="btn-event1" class="test-button event">
                            🎁 Event Box 1
                        </button>
                        <button id="btn-event2" class="test-button event">
                            🎁 Event Box 2
                        </button>
                    </div>
                </div>
            </details>
        </div>
        
        <!-- 아코디언 그룹: 신규 실험실 -->
        <div class="accordion-group">
            <details>
                <summary>🔬 신규 실험실</summary>
                <div class="accordion-content">
                    <div class="button-group">
                        <button id="btn-neon" class="test-button" style="background: linear-gradient(135deg, #00ffff 0%, #0099cc 100%);">
                            💍 Neon Ring
                        </button>
                    </div>
                </div>
            </details>
        </div>
        
        <!-- 크기 조절 슬라이더 -->
        <div class="size-control">
            <label for="size-slider" class="size-control-label">📏 크기 조절</label>
            <input type="range" id="size-slider" class="size-slider" min="0.5" max="2.0" step="0.1" value="1.0" title="가구 크기 조절 (0.5x ~ 2.0x)" aria-label="가구 크기 조절">
            <div class="size-value">
                크기: <span id="size-value-display">1.0x</span>
            </div>
        </div>
        
        <div class="info-section">
            <div class="info-title">ℹ️ 사용 방법</div>
            <div class="info-text">
                • 카테고리를 펼쳐 가구를 선택합니다.<br>
                • 마우스로 드래그하여 회전할 수 있습니다.<br>
                • 휠로 확대/축소가 가능합니다.<br>
                • 슬라이더로 가구 크기를 실시간 조절합니다.<br>
                • 초기화 버튼으로 화면을 비울 수 있습니다.
            </div>
        </div>
        
        <div id="status" class="status">
            초기화 중...
        </div>
    </div>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- OrbitControls를 THREE 네임스페이스에 추가 -->
    <script>
        if (typeof THREE !== 'undefined' && typeof OrbitControls !== 'undefined') {
            THREE.OrbitControls = OrbitControls;
        }
    </script>
    
    <!-- 로컬 모듈 로드 (전역 변수 방식) -->
    <script src="{{ url_for('static', filename='js/3d/GiftBox3D.js') }}?v={{ timestamp }}"></script>
    <script src="{{ url_for('static', filename='js/3d/NeonRing.js') }}?v={{ timestamp }}"></script>
    <script src="{{ url_for('static', filename='js/3d/ProductFactory.js') }}?v={{ timestamp }}"></script>
    <script src="{{ url_for('static', filename='js/3d/FurnitureViewer.js') }}?v={{ timestamp }}"></script>
    
    <script>
        let viewer = null;
        let factory = null;
        
        // 상태 업데이트 함수
        function updateStatus(message, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#EF4444' : '#10B981';
            statusEl.style.borderColor = isError ? '#EF4444' : '#10B981';
        }
        
        // 초기화
        function init() {
            try {
                // 디버깅: 로드된 모듈 확인
                console.log('[Furniture Studio] 모듈 로드 상태 확인:');
                console.log('  - THREE:', typeof THREE !== 'undefined' ? '✅' : '❌');
                console.log('  - THREE.OrbitControls:', typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined' ? '✅' : '❌');
                console.log('  - GiftBox3D:', typeof GiftBox3D !== 'undefined' ? '✅' : '❌');
                console.log('  - NeonRing:', typeof NeonRing !== 'undefined' ? '✅' : '❌');
                console.log('  - window.NeonRing:', typeof window.NeonRing !== 'undefined' ? '✅' : '❌');
                console.log('  - ProductFactory:', typeof ProductFactory !== 'undefined' ? '✅' : '❌');
                console.log('  - FurnitureViewer:', typeof FurnitureViewer !== 'undefined' ? '✅' : '❌');
                console.log('  - window.FurnitureViewer:', typeof window.FurnitureViewer !== 'undefined' ? '✅' : '❌');
                
                // 1. 뷰어 초기화
                if (typeof FurnitureViewer === 'undefined' && typeof window.FurnitureViewer === 'undefined') {
                    throw new Error('FurnitureViewer를 찾을 수 없습니다. 스크립트가 로드되었는지 확인하세요.');
                }
                
                const FurnitureViewerClass = FurnitureViewer || window.FurnitureViewer;
                viewer = new FurnitureViewerClass('viewer-canvas');
                updateStatus('✅ FurnitureViewer 초기화 완료');
                
                // 2. 팩토리 초기화 (뷰어의 scene 사용)
                if (typeof ProductFactory === 'undefined' && typeof window.ProductFactory === 'undefined') {
                    throw new Error('ProductFactory를 찾을 수 없습니다. 스크립트가 로드되었는지 확인하세요.');
                }
                
                const ProductFactoryClass = ProductFactory || window.ProductFactory;
                factory = new ProductFactoryClass(viewer.scene);
                updateStatus('✅ ProductFactory 초기화 완료');
                
                // 3. 버튼 이벤트 리스너 설정
                setupEventListeners();
                
                updateStatus('✅ 모든 시스템 준비 완료');
                
            } catch (error) {
                console.error('[Furniture Studio] 초기화 오류:', error);
                console.error('[Furniture Studio] 에러 메시지:', error.message);
                console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                updateStatus('❌ 초기화 실패: ' + error.message, true);
            }
        }
        
        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 초기화 버튼
            document.getElementById('btn-clear').onclick = () => {
                try {
                    if (viewer && viewer.currentProduct) {
                        viewer.scene.remove(viewer.currentProduct);
                        viewer.currentProduct = null;
                        // 슬라이더도 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ 화면 초기화 완료');
                    } else {
                        updateStatus('ℹ️ 제거할 가구가 없습니다');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] 초기화 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ 초기화 실패: ' + error.message, true);
                }
            };
            
            // 크기 조절 슬라이더
            const sizeSlider = document.getElementById('size-slider');
            const sizeValueDisplay = document.getElementById('size-value-display');
            
            sizeSlider.addEventListener('input', (e) => {
                try {
                    const scaleValue = parseFloat(e.target.value);
                    sizeValueDisplay.textContent = scaleValue.toFixed(1) + 'x';
                    
                    if (viewer && viewer.currentProduct) {
                        viewer.currentProduct.scale.set(scaleValue, scaleValue, scaleValue);
                        // 상태 메시지는 너무 자주 업데이트하지 않도록 주석 처리
                        // updateStatus(`📏 크기 조절: ${scaleValue.toFixed(1)}x`);
                    }
                } catch (error) {
                    console.error('[Furniture Studio] 크기 조절 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                }
            });
            
            // 슬라이더 리셋 함수 (가구 생성 시 호출)
            window.resetSizeSlider = () => {
                sizeSlider.value = 1.0;
                sizeValueDisplay.textContent = '1.0x';
            };
            
            // Gold Crown
            document.getElementById('btn-gold').onclick = () => {
                try {
                    const productData = {
                        name: "Gold",
                        price: 50000,
                        description: "프리미엄 골드 크라운"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createGoldCrown(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Gold Crown 생성 완료');
                    } else {
                        throw new Error('Gold Crown 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Gold Crown 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Gold Crown 생성 실패: ' + error.message, true);
                }
            };
            
            // Standard Coin
            document.getElementById('btn-standard').onclick = () => {
                try {
                    const productData = {
                        name: "Standard",
                        price: 10000,
                        description: "스탠다드 코인"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createStandardCoin(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Standard Coin 생성 완료');
                    } else {
                        throw new Error('Standard Coin 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Standard Coin 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Standard Coin 생성 실패: ' + error.message, true);
                }
            };
            
            // Premium Cube
            document.getElementById('btn-premium').onclick = () => {
                try {
                    const productData = {
                        name: "Premium",
                        price: 30000,
                        description: "프리미엄 큐브"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createPremiumCube(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Premium Cube 생성 완료');
                    } else {
                        throw new Error('Premium Cube 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Premium Cube 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Premium Cube 생성 실패: ' + error.message, true);
                }
            };
            
            // Event Box 1
            document.getElementById('btn-event1').onclick = () => {
                try {
                    const productData = {
                        name: "Event Box 1",
                        price: 0,
                        description: "이벤트 박스 1",
                        is_event: true,
                        event_type: "welcome"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createEventProduct(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Event Box 1 생성 완료');
                    } else {
                        throw new Error('Event Box 1 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Event Box 1 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Event Box 1 생성 실패: ' + error.message, true);
                }
            };
            
            // Event Box 2
            document.getElementById('btn-event2').onclick = () => {
                try {
                    const productData = {
                        name: "Event Box 2",
                        price: 0,
                        description: "이벤트 박스 2",
                        is_event: true,
                        event_type: "special"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createEventProduct(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Event Box 2 생성 완료');
                    } else {
                        throw new Error('Event Box 2 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Event Box 2 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Event Box 2 생성 실패: ' + error.message, true);
                }
            };
            
            // Neon Ring
            document.getElementById('btn-neon').onclick = () => {
                try {
                    const productData = {
                        name: "Neon Ring",
                        price: 0,
                        description: "네온 링 (실험실 제품)"
                    };
                    const pos = new THREE.Vector3(0, 0, 0);
                    
                    const group = factory.createNeonRing(productData, pos);
                    if (group) {
                        // 초기 스케일 설정
                        group.scale.set(1.0, 1.0, 1.0);
                        viewer.displayProduct(group);
                        // 슬라이더 리셋
                        if (window.resetSizeSlider) window.resetSizeSlider();
                        updateStatus('✅ Neon Ring 생성 완료');
                        
                        // 회전 애니메이션 시작
                        const animateNeonRing = () => {
                            if (viewer && viewer.currentProduct && viewer.currentProduct.userData.isAnimating) {
                                const NeonRingClass = NeonRing || window.NeonRing;
                                if (NeonRingClass) {
                                    NeonRingClass.animate(viewer.currentProduct);
                                }
                                requestAnimationFrame(animateNeonRing);
                            }
                        };
                        animateNeonRing();
                    } else {
                        throw new Error('Neon Ring 생성 실패');
                    }
                } catch (error) {
                    console.error('[Furniture Studio] Neon Ring 오류:', error);
                    console.error('[Furniture Studio] 에러 메시지:', error.message);
                    console.error('[Furniture Studio] 스택 트레이스:', error.stack);
                    updateStatus('❌ Neon Ring 생성 실패: ' + error.message, true);
                }
            };
        }
        
        // DOM 로드 완료 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
