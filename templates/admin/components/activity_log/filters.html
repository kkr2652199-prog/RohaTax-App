<!-- 활동 로그 필터 영역 -->
<div style="background-color: #f9fafb; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem;">
        <div>
            <label class="form-label fw-bold small">시작일</label>
            <input type="date" class="form-control form-control-sm filter-start-date">
        </div>
        <div>
            <label class="form-label fw-bold small">종료일</label>
            <input type="date" class="form-control form-control-sm filter-end-date">
        </div>
        <div>
            <label class="form-label fw-bold small">활동 유형</label>
            <select class="form-select form-select-sm filter-activity-type">
                <option value="">-- 전체 --</option>
                <!-- JavaScript가 동적으로 옵션을 생성합니다 -->
            </select>
        </div>
        <div>
            <label class="form-label fw-bold small">사용자 검색</label>
            <input type="text" class="form-control form-control-sm filter-user-search" placeholder="사용자 이름...">
        </div>
        <div>
            <button class="btn btn-primary btn-sm btn-apply-filters">검색</button>
        </div>
    </div>
</div>
