<!-- 로.하 TAX 동영상 플레이어 컴포넌트 -->
<div class="roha-video-player">
    <!-- 비디오 컨테이너 -->
    <div class="video-container">
        <video 
            id="rohaVideo" 
            class="video-element"
            poster="/static/images/video-poster.jpg"
            preload="auto"
            data-initialized="false">
            <source src="/static/videos/roha_conversion_demo.mp4.mp4" type="video/mp4">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            죄송합니다. 브라우저가 비디오 재생을 지원하지 않습니다.
        </video>
        
        <!-- 비디오 로드 실패 시 표시될 플레이스홀더 -->
        <div class="video-placeholder" style="display: none;">
            <div class="placeholder-content">
                <div class="placeholder-icon">🎬</div>
                <h3 class="placeholder-title">로.하 TAX 변환 데모</h3>
                <p class="placeholder-description">
                    3단계로 끝나는 스마트 변환 과정을 확인하세요!<br>
                    <strong>초간편 파일 업로드 → 완벽 검증 및 자동 정제 → 즉시 다운로드 및 완료</strong>
                </p>
                <div class="placeholder-steps">
                    <div class="step-item">
                        <span class="step-number">1</span>
                        <span class="step-text">Excel 파일 업로드</span>
                    </div>
                    <div class="step-item">
                        <span class="step-number">2</span>
                        <span class="step-text">AI 자동 변환</span>
                    </div>
                    <div class="step-item">
                        <span class="step-number">3</span>
                        <span class="step-text">홈택스 파일 다운로드</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 로딩 스피너 -->
        <div class="video-loading" style="display: none;">
            <div class="spinner"></div>
        </div>
        
        <!-- 중앙 재생 버튼 (큰 버튼) -->
        <div class="video-overlay">
            <button class="play-overlay-btn" aria-label="비디오 재생">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="35" fill="rgba(0,0,0,0.7)" stroke="white" stroke-width="2"/>
                    <path d="M 32 25 L 32 55 L 55 40 Z" fill="white"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- 새로운 비디오 컨트롤 바 -->
    <div class="video-control-bar">
        <!-- 진행 바 -->
        <div class="progress-section">
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-filled"></div>
                    <div class="progress-handle"></div>
                </div>
            </div>
            <div class="time-display">
                <span class="current-time">0:00</span>
                <span class="time-separator">/</span>
                <span class="duration-time">0:00</span>
            </div>
        </div>
        
        <!-- 컨트롤 버튼들 -->
        <div class="control-buttons">
            <!-- 재생/일시정지 버튼 -->
            <button class="control-btn play-pause-btn" aria-label="재생/일시정지">
                <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" fill="currentColor"/>
                </svg>
                <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" style="display:none;">
                    <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" fill="currentColor"/>
                </svg>
            </button>
            
            <!-- 볼륨 버튼 -->
            <div class="volume-container">
                <button class="control-btn volume-btn" aria-label="음소거 전환">
                    <svg class="volume-icon" width="20" height="20" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"/>
                    </svg>
                    <svg class="volume-mute-icon" width="20" height="20" viewBox="0 0 24 24" style="display:none;">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/>
                    </svg>
                </button>
                <!-- 볼륨 슬라이더 -->
                <div class="volume-slider-container">
                    <input type="range" class="volume-slider" min="0" max="100" value="100" aria-label="볼륨 조절">
                </div>
            </div>
            
            <!-- 전체화면 버튼 -->
            <button class="control-btn fullscreen-btn" aria-label="전체 화면">
                <svg class="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor"/>
                </svg>
                <svg class="fullscreen-exit-icon" width="20" height="20" viewBox="0 0 24 24" style="display:none;">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>
    
</div>

<!-- 비디오 플레이어 JavaScript -->
<script src="/static/js/components/video_player.js"></script>
