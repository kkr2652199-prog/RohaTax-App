<style>
  .token-activity-wrapper {
    background: linear-gradient(180deg, rgba(249, 250, 251, 0.95) 0%, #ffffff 60%);
    border: 1px solid #E5E7EB;
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
  }

  .token-activity-header,
  .token-activity-row {
    display: grid;
    grid-template-columns: 42px minmax(140px, 15%) minmax(110px, 12%) minmax(140px, 13%) minmax(0, 1fr) minmax(110px, 12%) minmax(110px, 12%) minmax(130px, 13%);
    align-items: stretch;
  }

  .token-activity-header {
    background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
    color: #1e293b;
    font-weight: 600;
    border: 1px solid #cbd5f5;
    border-radius: 12px 12px 0 0;
  }

  .token-activity-header-cell {
    padding: 14px 16px;
    border-right: 1px solid #cbd5f5;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
  }

  .token-activity-header-cell:last-child {
    border-right: none;
  }

  .token-activity-header-cell.checkbox-cell-header {
    justify-content: center;
  }

  .token-activity-header-cell.numeric-header {
    justify-content: flex-end;
    text-align: right;
  }

  .token-activity-body {
    border: 1px solid #E5E7EB;
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    background: #ffffff;
  }

  .token-activity-row {
    background: #ffffff;
  }

  .token-activity-row:nth-child(even) .token-activity-cell {
    background: #F9FAFB;
  }

  .token-activity-cell {
    padding: 14px 16px;
    border-right: 1px solid #E5E7EB;
    border-bottom: 1px solid #E5E7EB;
    font-size: 0.95rem;
    color: #1f2937;
    position: relative;
    background: inherit;
  }

  .token-activity-cell:last-child {
    border-right: none;
  }

  .token-activity-row:last-child .token-activity-cell {
    border-bottom: none;
  }

  .token-activity-row:hover .token-activity-cell {
    background: #EEF2FF;
    transition: background 0.2s ease;
  }

  .token-activity-cell.checkbox-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .token-activity-cell.numeric {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .token-activity-cell.numeric.credit {
    color: #047857;
    font-weight: 600;
  }

  .token-activity-cell.numeric.debit {
    color: #DC2626;
    font-weight: 600;
  }

  .token-activity-cell.numeric.balance {
    color: #1f2937;
    font-weight: 700;
  }

  .token-activity-cell .activity-detail {
    display: flex;
    flex-direction: column;
    gap: 4px;
    line-height: 1.4;
  }

  .token-activity-cell .activity-detail strong {
    font-weight: 600;
    color: #111827;
  }

  .token-activity-cell .activity-detail span {
    color: #6b7280;
    font-size: 0.85rem;
  }

  .token-activity-loader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 1.5rem;
    padding: 1rem 0;
    color: #4b5563;
    font-weight: 500;
  }

  .token-activity-loader .spinner {
    width: 18px;
    height: 18px;
    border: 3px solid #cbd5f5;
    border-top-color: #4f46e5;
    border-radius: 50%;
    animation: token-spinner 0.9s linear infinite;
  }

  @keyframes token-spinner {
    to { transform: rotate(360deg); }
  }

  .token-activity-note {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #6b7280;
    text-align: right;
  }

  .token-activity-empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: #6b7280;
    font-size: 0.95rem;
  }

  .token-activity-cell::before {
    display: none;
  }

  .token-activity-sentinel {
    width: 100%;
    height: 1px;
  }

  @media (max-width: 1000px) {
    .token-activity-wrapper {
      padding: 1.25rem;
    }

    .token-activity-header {
      display: none;
    }

    .token-activity-body {
      border: none;
      border-radius: 0;
      background: transparent;
    }

    .token-activity-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-areas:
        "type type"
        "detail detail"
        "date plan"
        "credit debit"
        "balance balance"
        "checkbox checkbox";
      gap: 0.75rem 1rem;
      background: #ffffff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      padding: 1.1rem 1.25rem;
    }

    .token-activity-row:nth-child(even) .token-activity-cell {
      background: transparent;
    }

    .token-activity-row:hover .token-activity-cell {
      background: transparent;
    }

    .token-activity-cell {
      border: none;
      padding: 0;
      background: transparent !important;
    }

    .token-activity-cell::before {
      display: block;
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .token-activity-cell.checkbox-cell {
      grid-area: checkbox;
      justify-content: flex-start;
    }

    .token-activity-cell.checkbox-cell::before {
      display: none;
    }

    .token-activity-cell.type-cell {
      grid-area: type;
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
    }

    .token-activity-cell.type-cell::before {
      display: none;
    }

    .token-activity-cell.detail-cell {
      grid-area: detail;
    }

    .token-activity-cell.detail-cell::before {
      display: none;
    }

    .token-activity-cell.date-cell {
      grid-area: date;
    }

    .token-activity-cell.plan-cell {
      grid-area: plan;
      text-align: right;
    }

    .token-activity-cell.credit-cell {
      grid-area: credit;
      text-align: left;
    }

    .token-activity-cell.debit-cell {
      grid-area: debit;
      text-align: right;
    }

    .token-activity-cell.balance-cell {
      grid-area: balance;
      text-align: right;
      font-size: 1.1rem;
      font-weight: 700;
    }
  }

  @media (max-width: 640px) {
    .token-activity-row {
      grid-template-columns: 1fr;
      grid-template-areas:
        "type"
        "detail"
        "date"
        "plan"
        "credit"
        "debit"
        "balance"
        "checkbox";
    }

    .token-activity-cell.plan-cell,
    .token-activity-cell.debit-cell,
    .token-activity-cell.balance-cell {
      text-align: left;
    }
  }
</style>

<div class="token-activity-wrapper">
  <div class="token-activity-header">
    <div class="token-activity-header-cell checkbox-cell-header">
      <input type="checkbox" aria-label="표시된 활동 전체 선택" disabled>
    </div>
    <div class="token-activity-header-cell">날짜/시간</div>
    <div class="token-activity-header-cell">회원등급</div>
    <div class="token-activity-header-cell">활동 유형</div>
    <div class="token-activity-header-cell">상세 정보</div>
    <div class="token-activity-header-cell numeric-header">토큰 총수량</div>
    <div class="token-activity-header-cell numeric-header">사용량</div>
    <div class="token-activity-header-cell numeric-header">토큰 총잔량</div>
  </div>

  <div class="token-activity-body" id="token-activity-list"></div>

  <div class="token-activity-loader" id="token-activity-loader">
    <div class="spinner" aria-hidden="true"></div>
    <span class="loader-text">데이터를 불러오는 중...</span>
  </div>

  <div id="token-activity-sentinel" class="token-activity-sentinel"></div>

  <div class="token-activity-note" id="token-activity-note">* 무한 스크롤을 통해 최신 활동이 자동으로 이어집니다.</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const listEl = document.getElementById('token-activity-list');
  const loaderEl = document.getElementById('token-activity-loader');
  const sentinelEl = document.getElementById('token-activity-sentinel');
  const noteEl = document.getElementById('token-activity-note');
  const defaultNoteText = noteEl ? noteEl.textContent : '';

  if (!listEl || !sentinelEl) {
    console.warn('[token-activity] 필수 요소(token-activity-list 또는 sentinel)를 찾을 수 없습니다.');
    return;
  }

  const PLAN_MAP = {
    'VIP': 'VIP (토큰차감)',
    'VIP-PLUS': 'VIP PLUS (토큰차감)',
    'PREMIUM': 'PREMIUM (토큰차감)',
    'PREMIUM-VIP': 'PREMIUM VIP (토큰차감)',
    'GOLD-VIP': 'GOLD VIP (무제한사용)',
    'GOLD': 'GOLD (무제한사용)',
    'FREE': 'FREE'
  };

  const LOG_TYPE_MAP = {
    'CONVERSION': '파일 변환',
    'GOLD_CONVERSION': '고객사 변환',
    'GRANT': '토큰 충전',
    'RESET': '관리자 초기화',
    'BONUS': '보너스 지급'
  };

  function formatNumber(value) {
    const num = Number(value || 0);
    return num.toLocaleString('ko-KR');
  }

  function createCell(className, label, content) {
    const cell = document.createElement('div');
    cell.className = `token-activity-cell ${className}`.trim();
    if (label) {
      cell.setAttribute('data-label', label);
    }

    if (content instanceof Node) {
      cell.appendChild(content);
    } else if (content !== undefined && content !== null) {
      cell.innerHTML = content;
    }

    return cell;
  }

  function buildDetail(entry, logLabel) {
    const wrapper = document.createElement('div');
    wrapper.className = 'activity-detail';

    const title = document.createElement('strong');
    const customer = (entry.customer_name || '').trim();
    const filename = (entry.filename || '').trim();

    if (customer && filename) {
      title.textContent = `${customer} (${filename})`;
    } else if (customer) {
      title.textContent = customer;
    } else if (filename) {
      title.textContent = filename;
    } else {
      title.textContent = '세부 정보 없음';
    }

    const subtitle = document.createElement('span');
    subtitle.textContent =
      logLabel === '파일 변환' ? '파일 변환 처리' :
      logLabel === '고객사 변환' ? '고객사 의뢰 처리' :
      logLabel === '토큰 충전' ? '결제/충전 완료' :
      logLabel === '관리자 초기화' ? '관리자 조정' :
      logLabel === '보너스 지급' ? '프로모션/보너스' : '활동 기록';

    wrapper.appendChild(title);
    wrapper.appendChild(subtitle);
    return wrapper;
  }

  function createActivityRow(entry) {
    const row = document.createElement('div');
    row.className = 'token-activity-row';
    if (entry.id !== undefined) {
      row.dataset.activityId = entry.id;
    }

    const planRaw = (entry.plan_type || '').toString().toUpperCase();
    const planLabel = PLAN_MAP[planRaw] || planRaw || '-';

    const logRaw = (entry.log_type || '').toString().toUpperCase();
    const logLabel = LOG_TYPE_MAP[logRaw] || (entry.log_type || '활동');

    const charge = Number(entry.charge_amount || 0);
    const usage = Number(entry.usage_amount || 0);
    const balance = Number(entry.balance_after || 0);

    const checkboxCell = createCell('checkbox-cell', '', '');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.setAttribute('aria-label', `${planLabel} ${logLabel} 활동 선택`);
    checkboxCell.appendChild(checkbox);

    row.appendChild(checkboxCell);
    row.appendChild(createCell('date-cell', '날짜/시간', entry.date || entry.datetime_kst || entry.created_at || '-'));
    row.appendChild(createCell('plan-cell', '회원등급', planLabel));
    row.appendChild(createCell('type-cell', '활동 유형', logLabel));

    const detailCell = createCell('detail-cell', '상세 정보', '');
    detailCell.appendChild(buildDetail(entry, logLabel));
    row.appendChild(detailCell);

    const creditText = charge > 0 ? `+${formatNumber(charge)}` : '-';
    const debitText = usage > 0 ? `-${formatNumber(usage)}` : '-';

    row.appendChild(createCell(charge > 0 ? 'numeric credit credit-cell' : 'numeric credit-cell', '토큰 총수량', creditText));
    row.appendChild(createCell(usage > 0 ? 'numeric debit debit-cell' : 'numeric debit-cell', '사용량', debitText));
    row.appendChild(createCell('numeric balance balance-cell', '토큰 총잔량', formatNumber(balance)));

    return row;
  }

  async function fetchActivityPage({ limit, offset }) {
    const query = new URLSearchParams({ limit: String(limit), offset: String(offset) });

    try {
      const response = await fetch(`/api/myhome-data?${query.toString()}`, {
        credentials: 'same-origin'
      });
      const data = await response.json();
      console.log('[token-activity][stage3] /api/myhome-data 응답:', data);

      if (!data || data.success === false) {
        console.warn('[token-activity][stage3] API 응답이 성공 상태가 아닙니다.');
        return 0;
      }

      const history = Array.isArray(data.activity_history) ? data.activity_history : [];
      history.forEach(entry => {
        const row = createActivityRow(entry);
        listEl.appendChild(row);
      });
      return history.length;
    } catch (error) {
      console.log('[token-activity][stage3] /api/myhome-data 호출 실패:', error);
      return 0;
    }
  }

  const PAGE_SIZE = 5;
  let offset = 0;
  let loading = false;
  let finished = false;

  async function loadNextPage() {
    if (loading || finished) {
      return;
    }

    loading = true;
    if (loaderEl) {
      loaderEl.style.display = 'flex';
    }

    const fetchedCount = await fetchActivityPage({ limit: PAGE_SIZE, offset });

    if (fetchedCount > 0) {
      offset += fetchedCount;
    }

    if (fetchedCount < PAGE_SIZE) {
      finished = true;
      observer.disconnect();
      if (loaderEl) {
        loaderEl.style.display = 'none';
      }
      if (noteEl) {
        noteEl.textContent = fetchedCount === 0 && offset === 0
          ? '활동 내역이 존재하지 않습니다.'
          : '모든 활동을 확인했습니다.';
      }
    }

    if (!finished && loaderEl) {
      loaderEl.style.display = 'none';
    }

    loading = false;
  }

  function resetAndReloadTokenActivity() {
    observer.disconnect();
    listEl.innerHTML = '';
    offset = 0;
    loading = false;
    finished = false;

    if (noteEl) {
      noteEl.textContent = defaultNoteText;
    }

    if (loaderEl) {
      loaderEl.style.display = 'flex';
    }

    observer.observe(sentinelEl);
    loadNextPage();
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        loadNextPage();
      }
    });
  }, {
    root: null,
    rootMargin: '200px 0px',
    threshold: 0.1
  });

  observer.observe(sentinelEl);

  window.initializeTokenActivity = loadNextPage;
  window.tokenActivityManager = {
    reset: resetAndReloadTokenActivity
  };
});
</script>
