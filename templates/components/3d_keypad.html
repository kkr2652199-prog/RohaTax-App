<!-- 3D Keypad Navigation Component -->
<div class="keypad-wrapper">
  <div class="keypad">
    <!-- Base Image (Optional - can be removed if not needed) -->
    <div class="keypad__base">
      <!-- Base image can be added here if needed -->
    </div>

    <!-- Button 1: 홈 -->
    <button id="one" class="key keypad__single" data-link="/" aria-label="홈으로 이동">
      <span class="key__mask">
        <span class="key__content">
          <span class="key__text">🏠 홈</span>
        </span>
      </span>
    </button>

    <!-- Button 2: 블로그 -->
    <button id="two" class="key keypad__single" data-link="/studio" aria-label="블로그 스튜디오로 이동">
      <span class="key__mask">
        <span class="key__content">
          <span class="key__text">📝 블로그</span>
        </span>
      </span>
    </button>

    <!-- Button 3: 상점 -->
    <button id="three" class="key keypad__single" data-link="/shop" aria-label="상점으로 이동">
      <span class="key__mask">
        <span class="key__content">
          <span class="key__text">🛍️ 상점</span>
        </span>
      </span>
    </button>

    <!-- Button 4: 마이홈 -->
    <button id="four" class="key keypad__single" data-link="/profile/edit" aria-label="마이홈으로 이동">
      <span class="key__mask">
        <span class="key__content">
          <span class="key__text">👤 마이홈</span>
        </span>
      </span>
    </button>

    <!-- Button 5: 뒤로 -->
    <button id="five" class="key keypad__single" onclick="history.back(); return false;" aria-label="이전 페이지로 이동">
      <span class="key__mask">
        <span class="key__content">
          <span class="key__text">🔙 뒤로</span>
        </span>
      </span>
    </button>
  </div>
</div>
