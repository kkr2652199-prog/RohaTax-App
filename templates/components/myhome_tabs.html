<!-- 탭 네비게이션 (통합 관제실 스타일 계승) -->
<ul class="nav nav-tabs mb-3" id="myhome-tabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-all" data-bs-toggle="tab" data-bs-target="#tab-content-all" 
                type="button" role="tab" data-tab="all" aria-selected="true">전체 활동</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-tokens" data-bs-toggle="tab" data-bs-target="#tab-content-tokens" 
                type="button" role="tab" data-tab="tokens" aria-selected="false">토큰 내역</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-system" data-bs-toggle="tab" data-bs-target="#tab-content-system" 
                type="button" role="tab" data-tab="system" aria-selected="false">시스템/보안</button>
    </li>
    {% if user.plan_type and user.plan_type|lower in ['gold','gold-vip'] %}
    <li class="nav-item" role="presentation">
        <button class="nav-link nav-link-gold" id="tab-gold" data-bs-toggle="tab" data-bs-target="#tab-content-gold" 
                type="button" role="tab" data-tab="gold" aria-selected="false">⭐ VIP 라운지</button>
    </li>
    {% endif %}
</ul>
