{% extends 'base.html' %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  header{display:none}
  body{
    background: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
  }
  .auth-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #ffffff;
  }
  .auth-card{
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    width: 400px;
    padding: 40px;
    max-width: 90vw;
  }
  .auth-card h1{
    margin: 0 0 8px 0;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .auth-card p{
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin: 0 0 32px 0;
  }
  .auth-actions{
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 24px;
  }
  .auth-actions a{
    text-decoration: none;
    color: #6b7280;
    font-weight: 500;
    font-size: 14px;
    transition: color 0.3s ease;
  }
  .auth-actions a:hover{
    color: #10b981;
  }
  .btn-primary{
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: #10b981;
    color: #ffffff;
    font-weight: 600;
    font-size: 16px;
    margin-top: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-primary:hover{
    background: #059669;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
  .btn-primary:disabled{
    background: #9ca3af;
    cursor: not-allowed;
    transform: none;
  }
  .btn-secondary{
    display: block;
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #10b981;
    border-radius: 12px;
    background: transparent;
    color: #10b981;
    font-weight: 600;
    font-size: 14px;
    margin-top: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-secondary:hover{
    background: #f0fdf4;
  }
  form{
    display: grid;
    gap: 16px;
  }
  input{
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    background: #ffffff;
    color: #1f2937;
    transition: all 0.3s ease;
    box-sizing: border-box;
  }
  input:focus{
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }
  input::placeholder{
    color: #9ca3af;
  }
  input.error{
    border-color: #dc2626;
  }
  .form-group{
    margin-bottom: 16px;
  }
  .form-group label{
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #374151;
    font-size: 14px;
  }
  .alert{
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .alert-success{
    background: rgba(16, 185, 129, 0.1);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .alert-error{
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }
  .alert-info{
    background: rgba(59, 130, 246, 0.1);
    color: #2563eb;
    border: 1px solid rgba(59, 130, 246, 0.2);
  }
  .verification-section{
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #e5e7eb;
  }
  .verification-section.active{
    display: block;
  }
  .code-input-group{
    display: flex;
    gap: 8px;
  }
  .code-input-group input{
    flex: 1;
    text-align: center;
    font-size: 20px;
    letter-spacing: 4px;
    font-weight: 600;
  }
  .info-text{
    font-size: 12px;
    color: #6b7280;
    margin-top: 8px;
    text-align: center;
  }
  @media (max-width: 480px) {
    .auth-card{
      width: 100%;
      padding: 24px;
    }
    .auth-card h1{
      font-size: 20px;
    }
  }
</style>
{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🔑 비밀번호 찾기</h1>
      <p>가입 시 등록한 휴대폰 번호를 입력해주세요</p>
      
      <div id="alert-container"></div>
      
      <form id="forgotPasswordForm">
        <div class="form-group">
          <input 
            type="tel" 
            id="phoneInput" 
            name="phone" 
            placeholder="010-1234-5678" 
            required
            pattern="[0-9]{3}-[0-9]{3,4}-[0-9]{4}"
            maxlength="13"
          >
        </div>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="button" id="sendCodeBtn" class="btn-primary">인증번호 받기</button>
        
        <div class="verification-section" id="verificationSection">
          <div class="form-group">
            <label>인증번호 입력</label>
            <div class="code-input-group">
              <input 
                type="text" 
                id="codeInput" 
                name="code" 
                placeholder="000000" 
                maxlength="6"
                pattern="[0-9]{6}"
              >
            </div>
            <p class="info-text">서버 로그에서 인증번호를 확인하세요</p>
          </div>
          <button type="button" id="verifyCodeBtn" class="btn-primary">인증 확인</button>
          <button type="button" id="resendCodeBtn" class="btn-secondary">인증번호 다시 받기</button>
        </div>
      </form>
      
      <div class="auth-actions">
        <a href="/login">로그인</a>
        <a href="/register">회원가입</a>
        <a href="/">홈으로</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const phoneInput = document.getElementById('phoneInput');
      const codeInput = document.getElementById('codeInput');
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const verifyCodeBtn = document.getElementById('verifyCodeBtn');
      const resendCodeBtn = document.getElementById('resendCodeBtn');
      const verificationSection = document.getElementById('verificationSection');
      const alertContainer = document.getElementById('alert-container');
      
      let currentPhone = '';
      
      // 휴대폰 번호 자동 포맷팅
      phoneInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/[^0-9]/g, '');
        if (value.length > 11) value = value.slice(0, 11);
        
        if (value.length >= 3 && value.length < 7) {
          value = value.slice(0, 3) + '-' + value.slice(3);
        } else if (value.length >= 7) {
          value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
        }
        
        e.target.value = value;
      });
      
      // 인증번호 숫자만 입력
      codeInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
      });
      
      // 알림 메시지 표시
      function showAlert(message, type) {
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => {
          alertContainer.innerHTML = '';
        }, 5000);
      }
      
      // 인증번호 발송
      sendCodeBtn.addEventListener('click', async function() {
        const phone = phoneInput.value.trim();
        
        if (!phone) {
          showAlert('휴대폰 번호를 입력해주세요.', 'error');
          phoneInput.focus();
          return;
        }
        
        // 휴대폰 번호 형식 검증
        const phoneRegex = /^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$/;
        if (!phoneRegex.test(phone)) {
          showAlert('올바른 휴대폰 번호를 입력해주세요. (예: 010-1234-5678)', 'error');
          phoneInput.focus();
          return;
        }
        
        sendCodeBtn.disabled = true;
        sendCodeBtn.textContent = '발송 중...';
        
        try {
          const formData = new FormData();
          formData.append('phone', phone);
          formData.append('csrf_token', document.querySelector('[name="csrf_token"]').value);
          
          const response = await fetch('/api/send-sms-code', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (data.success) {
            currentPhone = phone;
            phoneInput.disabled = true;
            verificationSection.classList.add('active');
            codeInput.focus();
            showAlert(data.message, 'success');
          } else {
            showAlert(data.message || '인증번호 발송에 실패했습니다.', 'error');
          }
        } catch (error) {
          console.error('인증번호 발송 오류:', error);
          showAlert('인증번호 발송 중 오류가 발생했습니다.', 'error');
        } finally {
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '인증번호 받기';
        }
      });
      
      // 인증번호 검증
      verifyCodeBtn.addEventListener('click', async function() {
        const phone = currentPhone || phoneInput.value.trim();
        const code = codeInput.value.trim();
        
        if (!code || code.length !== 6) {
          showAlert('인증번호 6자리를 입력해주세요.', 'error');
          codeInput.focus();
          return;
        }
        
        verifyCodeBtn.disabled = true;
        verifyCodeBtn.textContent = '확인 중...';
        
        try {
          const formData = new FormData();
          formData.append('phone', phone);
          formData.append('code', code);
          formData.append('csrf_token', document.querySelector('[name="csrf_token"]').value);
          
          const response = await fetch('/api/verify-sms-code', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (data.success) {
            showAlert('인증이 완료되었습니다. 비밀번호 재설정 페이지로 이동합니다.', 'success');
            setTimeout(() => {
              window.location.href = data.redirect_url;
            }, 1000);
          } else {
            showAlert(data.message || '인증번호가 일치하지 않습니다.', 'error');
            codeInput.value = '';
            codeInput.focus();
          }
        } catch (error) {
          console.error('인증번호 검증 오류:', error);
          showAlert('인증번호 검증 중 오류가 발생했습니다.', 'error');
        } finally {
          verifyCodeBtn.disabled = false;
          verifyCodeBtn.textContent = '인증 확인';
        }
      });
      
      // 인증번호 다시 받기
      resendCodeBtn.addEventListener('click', function() {
        codeInput.value = '';
        sendCodeBtn.click();
      });
      
      // Enter 키 처리
      phoneInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendCodeBtn.click();
        }
      });
      
      codeInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          verifyCodeBtn.click();
        }
      });
    })();
  </script>
{% endblock %}
