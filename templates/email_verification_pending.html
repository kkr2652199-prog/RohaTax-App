<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 대기 - 1Tax App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #F0FDF4 0%, #ECFDF5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .verification-container {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .verification-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            color: white;
        }
        
        .verification-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 1rem;
        }
        
        .verification-subtitle {
            font-size: 1rem;
            color: #6B7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .email-info {
            background: #F9FAFB;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #E5E7EB;
        }
        
        .email-label {
            font-size: 0.875rem;
            color: #6B7280;
            margin-bottom: 0.5rem;
        }
        
        .email-value {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1F2937;
        }
        
        .instructions {
            background: #FEF3C7;
            border: 1px solid #F59E0B;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        .instructions-title {
            font-size: 1rem;
            font-weight: 600;
            color: #92400E;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        
        .instructions-title::before {
            content: "📧";
            margin-right: 0.5rem;
        }
        
        .instructions-list {
            list-style: none;
            padding: 0;
        }
        
        .instructions-list li {
            font-size: 0.875rem;
            color: #92400E;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }
        
        .instructions-list li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #059669;
            font-weight: bold;
        }
        
        .resend-section {
            margin-bottom: 2rem;
        }
        
        .resend-button {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
        }
        
        .resend-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }
        
        .resend-button:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .back-to-login {
            margin-top: 2rem;
        }
        
        .back-to-login a {
            color: #10B981;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-to-login a:hover {
            color: #059669;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            background: #FEF3C7;
            color: #92400E;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        
        .status-indicator::before {
            content: "⏳";
            margin-right: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .verification-container {
                padding: 2rem;
                margin: 1rem;
            }
            
            .verification-title {
                font-size: 1.25rem;
            }
            
            .verification-subtitle {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-icon">📧</div>
        
        <h1 class="verification-title">이메일 인증이 필요합니다</h1>
        
        <div class="status-indicator">인증 대기 중</div>
        
        <p class="verification-subtitle">
            회원가입이 완료되었습니다!<br>
            입력하신 이메일 주소로 인증 링크를 발송했습니다.
        </p>
        
        <div class="email-info">
            <div class="email-label">인증 이메일 주소</div>
            <div class="email-value">{{ user.email }}</div>
        </div>
        
        <div class="instructions">
            <div class="instructions-title">인증 방법</div>
            <ul class="instructions-list">
                <li>이메일함을 확인해주세요 (스팸함도 확인)</li>
                <li>발송된 이메일의 인증 링크를 클릭하세요</li>
                <li>인증 완료 후 로그인하실 수 있습니다</li>
                <li>이메일이 오지 않으면 아래 버튼으로 재발송하세요</li>
            </ul>
        </div>
        
        <div class="resend-section">
            <form method="POST" action="{{ url_for('home.resend_verification') }}">
                <input type="hidden" name="user_id" value="{{ user.id }}">
                <input type="hidden" name="email" value="{{ user.email }}">
                <button type="submit" class="resend-button" id="resendBtn">
                    인증 이메일 재발송
                </button>
            </form>
        </div>
        
        <div class="back-to-login">
            <a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
        </div>
    </div>
    
    <script>
        // 재발송 버튼 클릭 시 잠시 비활성화
        document.getElementById('resendBtn').addEventListener('click', function() {
            this.disabled = true;
            this.textContent = '발송 중...';
            
            setTimeout(() => {
                this.disabled = false;
                this.textContent = '인증 이메일 재발송';
            }, 3000);
        });
        
        // 페이지 로드 시 자동 새로고침 (30초마다)
        let refreshInterval = setInterval(() => {
            // 사용자가 이미 인증했는지 확인
            fetch('/api/check-verification-status/{{ user.id }}')
                .then(response => response.json())
                .then(data => {
                    if (data.verified) {
                        clearInterval(refreshInterval);
                        window.location.href = '{{ url_for("auth.login") }}';
                    }
                })
                .catch(error => {
                    console.log('인증 상태 확인 중 오류:', error);
                });
        }, 30000);
        
        // 페이지를 떠날 때 인터벌 정리
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
