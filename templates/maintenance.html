<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 점검 중 - 로하택스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .maintenance-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .maintenance-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .maintenance-icon svg {
            width: 60px;
            height: 60px;
            color: white;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        
        .main-message {
            font-size: 18px;
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .maintenance-info {
            background: #f7fafc;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #2d3748;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            font-weight: 600;
            color: #4a5568;
        }
        
        .info-value {
            color: #1a202c;
        }
        
        .contact-info {
            background: #edf2f7;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .contact-title {
            font-size: 14px;
            font-weight: 600;
            color: #718096;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .contact-email {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .contact-email:hover {
            color: #764ba2;
        }
        
        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #a0aec0;
            line-height: 1.6;
        }
        
        @media (max-width: 640px) {
            .maintenance-container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .main-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>
        
        <h1>시스템 점검 중입니다</h1>
        
        <p class="main-message">
            더 안정적인 서비스를 위해 점검 중입니다.<br>
            잠시만 기다려 주시면 곧 돌아오겠습니다.
        </p>
        
        <div class="maintenance-info">
            <div class="info-item">
                <span class="info-label">점검 시작 시간:</span>
                <span class="info-value">{{ maintenance_time }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">예상 소요 시간:</span>
                <span class="info-value">약 1-2시간</span>
            </div>
        </div>
        
        <div class="contact-info">
            <div class="contact-title">문의사항이 있으시면 연락주세요</div>
            <a href="mailto:kweon4309@naver.com" class="contact-email">kweon4309@naver.com</a>
        </div>
        
        <p class="footer-note">
            빠른 시일 내에 서비스를 재개하도록 하겠습니다.<br>
            이용에 불편을 드려 죄송합니다.
        </p>
    </div>
</body>
</html>
